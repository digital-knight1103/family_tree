name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:data --seed
      - name: Przygotuj kanarek danych
        run: |
          mkdir -p data/family/photos
          node -e "require('fs').writeFileSync('data/family/family.json', JSON.stringify({version:1,revision:0,settings:{},persons:[{id:'p_canary',givenNames:'Kanarek',surname:'CANARY_LEAK_TEST_7f3a',sex:'unknown',living:false}],parentChild:[],unions:[]}))"
          echo CANARY_LEAK_TEST_7f3a > data/family/photos/p_canary.webp
      - name: Sprawdź kanarek danych ze schematem
        run: FAMILY_DATA_DIR=data/family pnpm validate:data
      - run: pnpm build
      - run: pnpm check:leaks
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
